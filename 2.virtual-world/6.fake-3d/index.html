<!DOCTYPE html>
<html>
    <head>
        <title>World Editor</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <h1>World Editor</h1>
        <canvas id="myCanvas"></canvas>
        <div id="controls">
            <button onclick="dispose()">🗑️</button>
            <button onclick="save()">💾</button>
        </div>

        <script src="js/world.js"></script>
        <script src="js/graphEditor.js"></script>
        <script src="js/viewport.js"></script>
        <script src="js/items/tree.js"></script>
        <script src="js/items/building.js"></script>
        <script src="js/math/utils.js"></script>
        <script src="js/math/graph.js"></script>

        <script src="js/primitives/point.js"></script>
        <script src="js/primitives/segment.js"></script>
        <script src="js/primitives/polygon.js"></script>
        <script src="js/primitives/envelope.js"></script>
        <script>
            myCanvas.width = 600;
            myCanvas.height = 600;

            const ctx = myCanvas.getContext("2d");

            const graphString = localStorage.getItem("graph");
            const graphInfo = graphString ? JSON.parse(graphString) : null;
            const graph = graphInfo
                ? Graph.load(graphInfo)
                : new Graph();
            const world = new World(graph);

            const viewport = new Viewport(myCanvas);
            const graphEditor = new GraphEditor(viewport, graph);

            let oldGraphHash = graph.hash();
            animate();

            function animate(){
                viewport.reset();

                //generate a new world ONLY if it has changed
                //i.e. its hash is different
                //this will save compute since we don't need to generate:
                //trees, buildings, roadborders
                if(graph.hash() != oldGraphHash){
                    world.generate();
                    oldGraphHash = graph.hash();
                }

                //use this viewPoint to add 3D effects (to trees, etc.)
                //this should refer to the Point in the center of the screen
                const viewPoint = scale(viewport.getOffset(), -1);

                //draw world.
                //viewPoint arg is used for 3D effects
                world.draw(ctx, viewPoint);

                //lower the alpha so that we can see the road markings
                //underneath the graph editor 
                ctx.globalAlpha = 0.3;
                graphEditor.display();

                //draw roads around the graph Points
                //new Envelope(graph.segments[0], 200, 20).draw(ctx);

                //draw a polygon around all of the graph Points
                //new Polygon(graph.points).draw(ctx);

                //recursively call animate() at 60 fps
                requestAnimationFrame(animate);
            }

            function dispose(){
                graphEditor.dispose();
            }

            function save(){
                localStorage.setItem("graph", JSON.stringify(graph));
            }
            
        </script>
    </body>
</html>
